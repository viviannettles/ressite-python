name: Dev Release (Angular + Flask/Python)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 0. Checkout code ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. ANGULAR FRONTEND BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Angular dependencies
        run: npm install
        working-directory: frontend/

      - name: Build Angular app
        run: npm run build
        working-directory: frontend/
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # --- FIX: COPY TO FLASK ---
      - name: Copy Angular Build to Backend
        run: |
          rm -rf backend/static/browser
          mkdir -p backend/static/browser

          # Find the Angular browser output directory dynamically
          BROWSER_DIR=$(find frontend/dist -type d -name "browser" | head -n 1)

          if [ -z "$BROWSER_DIR" ]; then
            echo "ERROR: Could not find Angular build output (browser directory)."
            echo "Dist contents:"
            ls -R frontend/dist
            exit 1
          fi

          echo "Found Angular build at: $BROWSER_DIR"
          cp -r "$BROWSER_DIR"/* backend/static/browser/

      # --- 2. FLASK BACKEND SETUP ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # --- FIX: VALIDATE FINAL STRUCTURE ---
      - name: Verify frontend was copied correctly
        run: |
          if [ ! -d "backend/static/browser" ]; then
            echo "Error: Angular static folder not found!"
            exit 1
          fi

          if [ ! -f "backend/static/browser/index.html" ]; then
            echo "Error: index.html missing in backend/static/browser"
            exit 1
          fi

          echo "Angular files successfully copied into Flask static folder"

      # --- 3. BACKEND TESTS ---
      - name: Run any backend tests (Placeholder)
        run: echo "No Python tests defined. Skipping."
        working-directory: backend/

      # --- 4. ARTIFACT CREATION ---
      - name: Archive Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ressite-python-artifact
          path: |
            backend/
            frontend/dist/
          retention-days: 1
          if-no-files-found: error
