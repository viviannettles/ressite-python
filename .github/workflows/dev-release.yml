name: Dev Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- CHECKOUT CODE ---
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- SET UP NODE ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- INSTALL ANGULAR DEPENDENCIES ---
      - name: Install Angular Dependencies
        working-directory: frontend
        run: npm ci

      # --- BUILD ANGULAR APP ---
      - name: Build Angular App
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # --- VERIFY ANGULAR OUTPUT ---
      - name: Verify Angular Output
        run: |
          echo "Listing backend/static after Angular build:"
          ls -R backend/static || echo "backend/static does not exist!"

      # --- SET UP PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- INSTALL PYTHON DEPENDENCIES ---
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- OPTIONAL: RUN PYTHON TESTS ---
      # Enable only if you have tests
      - name: Run Backend Tests (optional)
        working-directory: backend
        run: |
          echo "No tests configured. Skipping."
          # pytest


      # --- ARTIFACT CREATION ---
      - name: Archive Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ressite-python-artifact
          path: |
            backend/
          retention-days: 1
          if-no-files-found: error
