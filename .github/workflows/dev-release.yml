name: CI Build and Test (Angular + Flask)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 0. Checkout code ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. ANGULAR FRONTEND BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Angular dependencies
        run: npm install
        working-directory: frontend/

      - name: Build Angular app
        run: npm run build -- --output-path=dist
        working-directory: frontend/
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # --- 2. FLASK BACKEND SETUP ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: backend/

      # --- 3. INTEGRATION CHECK ---
      - name: Verify Flask can find Angular files (Path Check)
        run: |
          python -c "from main import PROJECT_ROOT, Path; \
                     FRONTEND_DIST_DIR_PATH = PROJECT_ROOT / 'frontend' / 'dist' / 'frontend' / 'browser'; \
                     assert FRONTEND_DIST_DIR_PATH.exists(), f'Expected dir not found: {FRONTEND_DIST_DIR_PATH}'"
        working-directory: backend/

      - name: Run any backend tests (Placeholder)
        run: echo "No Python tests defined. Skipping."
        working-directory: backend/

      # --- 4. ARTIFACT CREATION ---
      - name: Archive Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-web-artifact
          path: |
            backend/
            frontend/dist/
          retention-days: 1
          if-no-files-found: error
